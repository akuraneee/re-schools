import groovy.json.JsonSlurper

plugins {
    id 'com.android.application'
}

// Версия приложения — из package.json в корне репозитория.
def repoRoot = rootProject.file('..')
def appVersion = new JsonSlurper().parse(new File(repoRoot, 'package.json')).version as String
def nums = appVersion.tokenize('.').collect { it as int }
// В CI последнее число — номер сборки, чтобы новая версия ставилась поверх старой.
def run = System.getenv('GITHUB_RUN_NUMBER')
if (run) {
    nums[2] = run as int
    appVersion = nums.join('.')
}
def code = nums[0] * 1000000 + nums[1] * 10000 + nums[2]

// Интерфейс — общая папка web/ (та же, что в Electron). Кладём её в assets/web.
def webDir = new File(repoRoot, 'web')
def generatedAssets = layout.buildDirectory.dir('generated/rs-assets').get().asFile

// Подпись: постоянный ключ из переменных окружения, иначе — отладочный ключ.
def keystore = System.getenv('ANDROID_KEYSTORE_FILE')

android {
    namespace 'io.github.akuraneee.reschools'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.akuraneee.reschools'
        minSdk 26
        targetSdk 35
        versionCode code
        versionName appVersion
    }

    signingConfigs {
        release {
            if (keystore) {
                storeFile file(keystore)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig keystore ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            assets.srcDirs += [generatedAssets]
        }
    }
}

tasks.register('copyWeb', Copy) {
    from(webDir)
    into(new File(generatedAssets, 'web'))
}
tasks.named('preBuild') { dependsOn 'copyWeb' }
