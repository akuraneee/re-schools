# Тесты и APK на каждый push в любую ветку (APK — в артефактах запуска). При push в main — релиз
# v<major>.<minor>.<номер сборки> с файлом re-schools-android.apk (major.minor — rs.version в gradle.properties).
# pull_request не нужен: проверки push-запуска и так видны в PR из ветки этого репозитория.
name: Сборка

on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Тесты
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # Ядро (разбор schools.by, дневник, логика) — на выдуманном сайте; без Android SDK
      - run: ./gradlew -PcoreOnly :core:test --console=plain
      - id: v
        run: echo "version=$(grep '^rs.version=' gradle.properties | cut -d= -f2 | cut -d. -f1,2).${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

  android:
    name: APK для Android
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Платформа Android SDK 37
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" "build-tools;36.0.0" > /dev/null
      - name: Ключ подписи (если добавлен в секреты)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Секрет ANDROID_KEYSTORE_BASE64 не задан — APK подписан временным ключом, обновление поверх старой версии не встанет."
          fi
      - name: Сборка APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease --console=plain
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/re-schools-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/re-schools-android.apk
          if-no-files-found: error

  release:
    name: Релиз
    if: github.ref == 'refs/heads/main'
    needs: [test, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.test.outputs.version }}
          name: re:schools ${{ needs.test.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          generate_release_notes: true
          files: release/*
